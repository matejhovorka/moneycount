<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Subtle ambient glow -->
  <circle cx="256" cy="230" r="180" fill="url(#glowGrad)" />

  <!-- Main Symbol: Modern Car / Speedometer & Fuel + Split Icon -->
  <g filter="url(#shadow)">
    <!-- Road / Speed arc -->
    <path d="M120 340 C120 240, 200 170, 256 170 C312 170, 392 240, 392 340" 
          fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round" />
    <path d="M140 330 C160 260, 210 200, 256 200 C302 200, 352 260, 372 330" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="140 30" />
    
    <!-- Fuel Pump Body (Left side) -->
    <rect x="180" y="240" width="70" height="95" rx="14" fill="url(#primaryGrad)" />
    <rect x="192" y="254" width="46" height="32" rx="6" fill="#0f172a" />
    <!-- Fuel nozzle / hose -->
    <path d="M250 260 C265 260, 275 270, 275 285 L275 320" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <path d="M275 320 L285 305" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

    <!-- Split / People / Coin Badge (Right side floating) -->
    <circle cx="315" cy="275" r="54" fill="url(#accentGrad)" stroke="#0f172a" stroke-width="6" />
    <!-- Currency / Division glyph -->
    <text x="315" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">Kč</text>

    <!-- Two small user silhouettes or split arrows under it -->
    <g transform="translate(196, 360)">
      <!-- Person 1 -->
      <circle cx="20" cy="8" r="8" fill="#94a3b8" />
      <path d="M6 32 C6 24 12 20 20 20 C28 20 34 24 34 32" fill="#94a3b8" />
      
      <!-- Split divider / slash -->
      <line x1="52" y1="5" x2="68" y2="30" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

      <!-- Person 2 -->
      <circle cx="100" cy="8" r="8" fill="#38bdf8" />
      <path d="M86 32 C86 24 92 20 100 20 C108 20 114 24 114 32" fill="#38bdf8" />
    </g>
  </g>
</svg>
